name: ChainBox Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (e.g. v1.0.10)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout ChainBox app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: sing-box-for-android

      - name: Checkout Chain kernel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dukangalex/sing-box
          ref: chain-dev
          path: sing-box
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK components
        run: |
          set -e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --install "ndk;28.0.13004108" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Test Chain kernel
        working-directory: sing-box
        run: go test ./...

      - name: Build libbox AAR
        working-directory: sing-box
        run: |
          set -e
          go run ./cmd/internal/build_libbox -target android -platform android/arm64 -debug
          mkdir -p ../sing-box-for-android/app/libs
          cp -f libbox.aar ../sing-box-for-android/app/libs/libbox.aar
          if [ -f libbox-legacy.aar ]; then cp -f libbox-legacy.aar ../sing-box-for-android/app/libs/; else cp -f libbox.aar ../sing-box-for-android/app/libs/libbox-legacy.aar; fi

      - name: Configure release signing
        working-directory: sing-box-for-android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          STORE_PASS="${KEYSTORE_PASS:-$KEYSTORE_PASSWORD}"
          ALIAS="${ALIAS_NAME:-$KEY_ALIAS}"
          KEY_PASS="${ALIAS_PASS:-$KEY_PASSWORD}"
          test -n "$STORE_PASS" && test -n "$ALIAS" && test -n "$KEY_PASS"
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          {
            echo "KEYSTORE_PASS=$STORE_PASS"
            echo "ALIAS_NAME=$ALIAS"
            echo "ALIAS_PASS=$KEY_PASS"
          } >> local.properties

      - name: Assemble release APK
        working-directory: sing-box-for-android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :app:assembleOtherRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e
          mkdir -p dist
          find sing-box-for-android -type f -name "*.apk" -exec cp -v {} dist/ \;
          PREFERRED=$(ls dist/*arm64-v8a*.apk 2>/dev/null | grep -v debug | head -n1 || true)
          if [ -z "$PREFERRED" ]; then PREFERRED=$(ls dist/*.apk | head -n1); fi
          cp -f "$PREFERRED" dist/ChainBox-android.apk

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.version_tag }}
          name: ChainBox ${{ inputs.version_tag }}
          body: |
            ChainBox official signed Android client.
          files: dist/ChainBox-android.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
