name: ChainBox CI

on:
  pull_request:
    branches:
      - dev
      - chain-dev
  push:
    branches:
      - dev
      - chain-dev

permissions:
  contents: read

jobs:
  kernel-test:
    name: sing-box kernel tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ChainBox
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: chainbox

      - name: Checkout Chain kernel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dukangalex/sing-box
          ref: chain-dev
          path: sing-box
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.5"

      - name: Test kernel
        working-directory: sing-box
        run: |
          set -euo pipefail
          packages=$(go list ./... | grep -v '^github.com/sagernet/sing-box/experimental/boxdd$' | grep -v '^github.com/sagernet/sing-box/experimental/libbox$')
          sudo -E go test $packages

  android-compile:
    name: ChainBox Android compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout ChainBox
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: sing-box-for-android

      - name: Checkout Chain kernel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dukangalex/sing-box
          ref: chain-dev
          path: sing-box
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --install "ndk;28.0.13004108" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          test -d "${ANDROID_HOME}/ndk/28.0.13004108"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          set -euo pipefail
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" version
          "$(go env GOPATH)/bin/gomobile" init || true

      - name: Build libbox AAR
        working-directory: sing-box
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME
          go run ./cmd/internal/build_libbox -target android -platform android/arm64 -debug
          mkdir -p ../sing-box-for-android/app/libs
          FOUND=$(find . .. -name 'libbox.aar' -type f 2>/dev/null | head -n1 || true)
          if [ -z "$FOUND" ]; then
            echo "libbox.aar not produced; falling back to gomobile bind"
            TAGS="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_low_memory,badlinkname,tfogo_checklinkname0"
            gomobile bind -v -o libbox.aar -target android/arm64 -androidapi 24 \
              -javapkg=io.nekohasekai -libname=box -trimpath -tags "$TAGS" ./experimental/libbox
            FOUND=libbox.aar
          fi
          cp -f "$FOUND" ../sing-box-for-android/app/libs/libbox.aar
          if [ -f libbox-legacy.aar ]; then
            cp -f libbox-legacy.aar ../sing-box-for-android/app/libs/libbox-legacy.aar
          else
            cp -f "$FOUND" ../sing-box-for-android/app/libs/libbox-legacy.aar
          fi
          ls -lah ../sing-box-for-android/app/libs/
          test -s ../sing-box-for-android/app/libs/libbox.aar

      - name: Compile ChainBox
        working-directory: sing-box-for-android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileOtherDebugKotlin --no-daemon --stacktrace
