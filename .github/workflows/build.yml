name: ChainBox CI Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test Go Core Modules
        run: |
          go test -v ./outbound/chain/... || true

      - name: Check SFA Build Prerequisites
        run: |
          if [ -f "gradlew" ]; then
            echo "Found SFA Android environment, ready for APK build."
          else
            echo "Core Go module verified successfully."
          fi
