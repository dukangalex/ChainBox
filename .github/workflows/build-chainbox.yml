name: Build ChainBox APK

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build-chainbox.yml'

permissions:
  contents: write

jobs:
  build-libbox-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout ChainBox app
        uses: actions/checkout@v4
        with:
          path: sing-box-for-android

      - name: Checkout Chain sing-box kernel
        uses: actions/checkout@v4
        with:
          repository: dukangalex/sing-box
          ref: chain-dev
          path: sing-box
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install NDK 28
        run: |
          set -e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --install "ndk;28.0.13004108" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Install gomobile
        working-directory: sing-box
        run: |
          set -e
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install github.com/sagernet/gomobile/cmd/gomobile@latest 2>/dev/null || go install golang.org/x/mobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest 2>/dev/null || go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init || true
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build libbox.aar
        working-directory: sing-box
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -e
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME

          if go run ./cmd/internal/build_libbox -target android -platform android/arm64 -debug; then
            echo "build_libbox succeeded"
          else
            echo "build_libbox failed, fallback gomobile bind"
            TAGS="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_low_memory,badlinkname,tfogo_checklinkname0"
            gomobile bind -v -o libbox.aar -target android/arm64 -androidapi 24 \
              -javapkg=io.nekohasekai -libname=box \
              -trimpath -tags "$TAGS" \
              ./experimental/libbox
          fi

          ls -lh libbox*.aar
          mkdir -p ../sing-box-for-android/app/libs
          cp -f libbox.aar ../sing-box-for-android/app/libs/
          if [ -f libbox-legacy.aar ]; then
            cp -f libbox-legacy.aar ../sing-box-for-android/app/libs/
          else
            cp -f libbox.aar ../sing-box-for-android/app/libs/libbox-legacy.aar
          fi
          ls -lh ../sing-box-for-android/app/libs/

      - name: Upload libbox (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box-for-android/app/libs/*.aar
          if-no-files-found: warn

      - name: Assemble otherDebug APK
        working-directory: sing-box-for-android
        run: |
          set -e
          chmod +x gradlew
          ls -lah app/libs/
          ./gradlew :app:assembleOtherDebug --stacktrace 2>&1 | tee /tmp/gradle.log
          # print tail of log on failure is handled by set -e

      - name: Show gradle log tail on failure
        if: failure()
        run: |
          echo "===== gradle log (last 200 lines) ====="
          tail -200 /tmp/gradle.log || true
          find sing-box-for-android -name "*.apk" 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChainBox-apk
          path: sing-box-for-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
