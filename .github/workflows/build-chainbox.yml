name: Build ChainBox APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish APK to GitHub Releases'
        required: false
        default: 'false'
        type: boolean
      version_tag:
        description: 'Release tag when publishing (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build-chainbox.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout ChainBox app
        uses: actions/checkout@v4
        with:
          path: sing-box-for-android

      - name: Checkout Chain sing-box kernel
        uses: actions/checkout@v4
        with:
          repository: dukangalex/sing-box
          ref: chain-dev
          path: sing-box
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install NDK 28
        run: |
          set -e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --install "ndk;28.0.13004108" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Install gomobile
        working-directory: sing-box
        run: |
          set -e
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install github.com/sagernet/gomobile/cmd/gomobile@latest 2>/dev/null || go install golang.org/x/mobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest 2>/dev/null || go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init || true
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build libbox.aar
        working-directory: sing-box
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -e
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME
          go run ./cmd/internal/build_libbox -target android -platform android/arm64 -debug
          ls -lh libbox*.aar
          mkdir -p ../sing-box-for-android/app/libs
          cp -f libbox.aar ../sing-box-for-android/app/libs/
          if [ -f libbox-legacy.aar ]; then
            cp -f libbox-legacy.aar ../sing-box-for-android/app/libs/
          else
            cp -f libbox.aar ../sing-box-for-android/app/libs/libbox-legacy.aar
          fi
          ls -lh ../sing-box-for-android/app/libs/

      - name: Upload libbox
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box-for-android/app/libs/*.aar

      - name: Assemble APKs
        id: assemble
        working-directory: sing-box-for-android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ls -lah app/libs/
          ./gradlew :app:assembleOtherDebug \
            -x lint \
            -x lintDebug \
            -x detekt \
            -x spotlessCheck \
            -x spotlessKotlin \
            --stacktrace \
            --no-daemon \
            2>&1 | tee /tmp/gradle-assemble.log

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle-assemble.log
          if-no-files-found: ignore

      - name: Collect APKs
        if: success()
        run: |
          set -e
          mkdir -p dist
          find sing-box-for-android -type f -name "*.apk" -exec cp -v {} dist/ \;
          # Stable name for releases
          for f in dist/*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            cp -f "$f" "dist/ChainBox-android.apk"
            break
          done
          ls -lah dist || true
          test "$(ls -A dist 2>/dev/null)"

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChainBox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          name: ChainBox ${{ inputs.version_tag }}
          body: |
            ChainBox independent Android client with syncable Chain kernel.

            - Package: `io.chainbox.app`
            - Kernel: dukangalex/sing-box `chain-dev`
            - Features: chain outbound, group→node / group→group builder

            Install the APK, open **工具 → 链式代理**, then rebuild service after writing chain.
          files: |
            dist/ChainBox-android.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
