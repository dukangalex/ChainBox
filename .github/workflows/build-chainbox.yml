name: Build ChainBox APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub release"
        required: false
        default: "false"
        type: string
      version_tag:
        description: "Release tag (e.g. v1.0.3)"
        required: false
        default: "v0.0.0-test"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout ChainBox app
        uses: actions/checkout@v4
        with:
          path: sing-box-for-android

      - name: Checkout Chain sing-box kernel
        uses: actions/checkout@v4
        with:
          repository: dukangalex/sing-box
          ref: chain-dev
          path: sing-box
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install NDK 28
        run: |
          set -e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --install "ndk;28.0.13004108" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Install gomobile (SagerNet preferred)
        working-directory: sing-box
        run: |
          set -e
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install github.com/sagernet/gomobile/cmd/gomobile@latest 2>/dev/null || go install golang.org/x/mobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest 2>/dev/null || go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init || true
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build libbox.aar
        working-directory: sing-box
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -e
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME
          if go run ./cmd/internal/build_libbox -target android -platform android/arm64 -debug; then
            echo "build_libbox succeeded"
          else
            echo "build_libbox failed, fallback gomobile bind"
            TAGS="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_low_memory,badlinkname,tfogo_checklinkname0"
            gomobile bind -v -o libbox.aar -target android/arm64 -androidapi 24 \
              -javapkg=io.nekohasekai -libname=box \
              -trimpath -tags "$TAGS" \
              ./experimental/libbox
          fi
          mkdir -p ../sing-box-for-android/app/libs
          cp -f libbox.aar ../sing-box-for-android/app/libs/
          if [ -f libbox-legacy.aar ]; then
            cp -f libbox-legacy.aar ../sing-box-for-android/app/libs/
          else
            cp -f libbox.aar ../sing-box-for-android/app/libs/libbox-legacy.aar
          fi

      - name: Upload libbox
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box-for-android/app/libs/*.aar

      - name: Setup release keystore
        working-directory: sing-box-for-android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret; will build debug-signed APK"
            exit 0
          fi
          STORE_PASS="${KEYSTORE_PASS:-$KEYSTORE_PASSWORD}"
          ALIAS="${ALIAS_NAME:-$KEY_ALIAS}"
          KEY_PASS="${ALIAS_PASS:-$KEY_PASSWORD}"
          if [ -z "$STORE_PASS" ] || [ -z "$ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Keystore file present but password/alias secrets missing; debug APK"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          {
            echo "KEYSTORE_PASS=$STORE_PASS"
            echo "ALIAS_NAME=$ALIAS"
            echo "ALIAS_PASS=$KEY_PASS"
          } >> local.properties
          echo "Release keystore configured (alias=$ALIAS)"
          ls -lah app/release.keystore

      - name: Assemble APKs
        id: assemble
        working-directory: sing-box-for-android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -o pipefail
          chmod +x gradlew
          if [ -f app/release.keystore ] && grep -q '^KEYSTORE_PASS=.' local.properties 2>/dev/null; then
            TASK=":app:assembleOtherRelease"
          else
            TASK=":app:assembleOtherDebug"
          fi
          echo "Building $TASK"
          ./gradlew $TASK \
            -x lint -x lintDebug -x lintRelease -x detekt -x spotlessCheck -x spotlessKotlin \
            --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-assemble.log

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle-assemble.log
          if-no-files-found: ignore

      - name: Collect APKs
        if: success()
        run: |
          set -e
          mkdir -p dist
          find sing-box-for-android -type f -name "*.apk" -exec cp -v {} dist/ \;
          PREFERRED=$(ls dist/*arm64-v8a*.apk 2>/dev/null | grep -v debug | head -n1 || true)
          if [ -z "$PREFERRED" ]; then
            PREFERRED=$(ls dist/*arm64-v8a*.apk 2>/dev/null | head -n1 || true)
          fi
          if [ -z "$PREFERRED" ]; then
            PREFERRED=$(ls dist/*.apk | head -n1)
          fi
          cp -f "$PREFERRED" dist/ChainBox-android.apk
          echo "Official APK: $PREFERRED"
          ls -lah dist

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChainBox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success() && github.event_name == 'workflow_dispatch' && (inputs.publish_release == 'true' || inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          name: ChainBox ${{ inputs.version_tag }}
          body: |
            ChainBox official signed Android client.

            Install `ChainBox-android.apk` (arm64).

            - Package: `io.chainbox.app`
            - Signed with the repository release keystore
          files: |
            dist/ChainBox-android.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
