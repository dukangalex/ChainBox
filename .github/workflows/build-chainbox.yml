name: Build ChainBox APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub release"
        required: false
        default: "false"
        type: string
      version_tag:
        description: "Release tag (e.g. v0.1.18)"
        required: false
        default: "v0.0.0-test"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: sing-box-for-android

      - name: Checkout chain kernel
        uses: actions/checkout@v4
        with:
          repository: dukangalex/sing-box
          ref: chain-dev
          path: sing-box

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build libbox.aar
        working-directory: sing-box
        run: |
          set -e
          go run ./cmd/internal/build_libbox -target android -platform android/arm64 -debug
          mkdir -p ../sing-box-for-android/app/libs
          if [ -f libbox.aar ]; then
            cp -f libbox.aar ../sing-box-for-android/app/libs/libbox.aar
          else
            cp -f libbox.aar ../sing-box-for-android/app/libs/libbox-legacy.aar || true
            find . -name "libbox*.aar" -exec cp -f {} ../sing-box-for-android/app/libs/ \;
          fi
          ls -lh ../sing-box-for-android/app/libs/

      - name: Upload libbox
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box-for-android/app/libs/*.aar

      - name: Setup release keystore (optional, enables in-place updates)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: sing-box-for-android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          {
            echo "KEYSTORE_PASS=$KEYSTORE_PASS"
            echo "ALIAS_NAME=$ALIAS_NAME"
            echo "ALIAS_PASS=$ALIAS_PASS"
          } >> local.properties
          ls -lah app/release.keystore

      - name: Assemble APKs
        id: assemble
        working-directory: sing-box-for-android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ls -lah app/libs/
          if [ -f app/release.keystore ]; then
            TASK=":app:assembleOtherRelease"
          else
            TASK=":app:assembleOtherDebug"
          fi
          echo "Building $TASK"
          ./gradlew $TASK \
            -x lint \
            -x lintDebug \
            -x lintRelease \
            -x detekt \
            -x spotlessCheck \
            -x spotlessKotlin \
            --stacktrace \
            --no-daemon \
            2>&1 | tee /tmp/gradle-assemble.log

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle-assemble.log
          if-no-files-found: ignore

      - name: Collect APKs
        if: success()
        run: |
          set -e
          mkdir -p dist
          find sing-box-for-android -type f -name "*.apk" -exec cp -v {} dist/ \;
          for f in dist/*.apk; do
            [ -f "$f" ] || continue
            cp -f "$f" "dist/ChainBox-android.apk"
            break
          done
          ls -lah dist || true
          test "$(ls -A dist 2>/dev/null)"

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChainBox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          name: ChainBox ${{ inputs.version_tag }}
          body: |
            ChainBox independent Android client.

            - Package: `io.chainbox.app`
            - Backup/restore (local + WebDAV)
            - Profile override switches, chain persistence
          files: |
            dist/ChainBox-android.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
