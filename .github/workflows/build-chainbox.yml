name: Build ChainBox APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub release"
        required: false
        default: "false"
        type: string
      version_tag:
        description: "Release tag (e.g. v1.0.3)"
        required: false
        default: "v0.0.0-test"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout ChainBox app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: sing-box-for-android

      - name: Checkout Chain sing-box kernel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dukangalex/sing-box
          ref: chain-dev
          path: sing-box
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Accept licenses and install NDK 28
        run: |
          set -e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --install "ndk;28.0.13004108" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Test Chain sing-box kernel
        working-directory: sing-box
        run: |
          set -e
          go test ./...

      - name: Build libbox.aar
        working-directory: sing-box
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -e
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME
          go run ./cmd/internal/build_libbox -target android -platform android/arm64 -debug
          mkdir -p ../sing-box-for-android/app/libs
          cp -f libbox.aar ../sing-box-for-android/app/libs/
          if [ -f libbox-legacy.aar ]; then
            cp -f libbox-legacy.aar ../sing-box-for-android/app/libs/
          else
            cp -f libbox.aar ../sing-box-for-android/app/libs/libbox-legacy.aar
          fi

      - name: Upload libbox
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: libbox-aar
          path: sing-box-for-android/app/libs/*.aar

      - name: Setup release keystore
        working-directory: sing-box-for-android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret; build debug APK"
            exit 0
          fi
          STORE_PASS="${KEYSTORE_PASS:-$KEYSTORE_PASSWORD}"
          ALIAS="${ALIAS_NAME:-$KEY_ALIAS}"
          KEY_PASS="${ALIAS_PASS:-$KEY_PASSWORD}"
          test -n "$STORE_PASS" && test -n "$ALIAS" && test -n "$KEY_PASS"
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          {
            echo "KEYSTORE_PASS=$STORE_PASS"
            echo "ALIAS_NAME=$ALIAS"
            echo "ALIAS_PASS=$KEY_PASS"
          } >> local.properties
          echo "Release keystore configured"

      - name: Assemble APKs
        id: assemble
        working-directory: sing-box-for-android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -o pipefail
          chmod +x gradlew
          if [ -f app/release.keystore ] && grep -q '^KEYSTORE_PASS=.' local.properties 2>/dev/null; then
            TASK=":app:assembleOtherRelease"
          else
            TASK=":app:assembleOtherDebug"
          fi
          echo "Building $TASK"
          ./gradlew $TASK \
            -x lint -x lintDebug -x lintRelease -x detekt -x spotlessCheck -x spotlessKotlin \
            --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-assemble.log

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gradle-log
          path: /tmp/gradle-assemble.log
          if-no-files-found: ignore

      - name: Collect APKs
        if: success()
        run: |
          set -e
          mkdir -p dist
          find sing-box-for-android -type f -name "*.apk" -exec cp -v {} dist/ \;
          PREFERRED=$(ls dist/*arm64-v8a*.apk 2>/dev/null | grep -v debug | head -n1 || true)
          if [ -z "$PREFERRED" ]; then PREFERRED=$(ls dist/*arm64-v8a*.apk 2>/dev/null | head -n1 || true); fi
          if [ -z "$PREFERRED" ]; then PREFERRED=$(ls dist/*.apk | head -n1); fi
          cp -f "$PREFERRED" dist/ChainBox-android.apk
          ls -lah dist

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ChainBox-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success() && github.event_name == 'workflow_dispatch' && (inputs.publish_release == 'true' || inputs.publish_release == true)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.version_tag }}
          name: ChainBox ${{ inputs.version_tag }}
          body: |
            ChainBox official signed Android client.

            Install `ChainBox-android.apk` (arm64).

            - Package: `io.chainbox.app`
            - Signing identity is supplied only through GitHub Actions secrets.
          files: |
            dist/ChainBox-android.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
