name: Build ChainBox APK

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build-chainbox.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout ChainBox app
        uses: actions/checkout@v4
        with:
          path: sing-box-for-android

      - name: Checkout Chain sing-box kernel
        uses: actions/checkout@v4
        with:
          repository: dukangalex/sing-box
          ref: chain-dev
          path: sing-box
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install NDK 28
        run: |
          set -e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --install "ndk;28.0.13004108" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Install gomobile
        working-directory: sing-box
        run: |
          set -e
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install github.com/sagernet/gomobile/cmd/gomobile@latest 2>/dev/null || go install golang.org/x/mobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest 2>/dev/null || go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init || true
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build libbox.aar
        working-directory: sing-box
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -e
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME

          go run ./cmd/internal/build_libbox -target android -platform android/arm64 -debug

          ls -lh libbox*.aar
          mkdir -p ../sing-box-for-android/app/libs
          cp -f libbox.aar ../sing-box-for-android/app/libs/
          if [ -f libbox-legacy.aar ]; then
            cp -f libbox-legacy.aar ../sing-box-for-android/app/libs/
          else
            cp -f libbox.aar ../sing-box-for-android/app/libs/libbox-legacy.aar
          fi
          ls -lh ../sing-box-for-android/app/libs/

      - name: Upload libbox
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box-for-android/app/libs/*.aar

      - name: Assemble APKs
        working-directory: sing-box-for-android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -e
          chmod +x gradlew
          ls -lah app/libs/

          # Try debug first (no signing secrets required)
          ./gradlew :app:assembleOtherDebug --stacktrace --no-daemon

          echo "===== search apk ====="
          find app/build/outputs -type f -name "*.apk" -print || true
          find . -type f -name "*.apk" -print || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ChainBox-apk
          path: |
            sing-box-for-android/app/build/outputs/**/*.apk
            sing-box-for-android/**/*.apk
          if-no-files-found: error
