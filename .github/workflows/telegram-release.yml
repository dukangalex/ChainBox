name: Telegram Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce (empty = latest published release)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  telegram-release:
    name: Publish Release to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}

    steps:
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME_FIELD: ${{ github.event.release.name }}
          EVENT_URL: ${{ github.event.release.html_url }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "release" ]; then
            TAG="${EVENT_TAG}"
            NAME="${EVENT_NAME_FIELD}"
            URL="${EVENT_URL}"
          else
            if [ -n "${INPUT_TAG}" ]; then
              API_URL="${GITHUB_API_URL}/repos/${REPO}/releases/tags/${INPUT_TAG}"
            else
              API_URL="${GITHUB_API_URL}/repos/${REPO}/releases/latest"
            fi
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}" > resolved-release.json
            TAG="$(jq -r '.tag_name' resolved-release.json)"
            NAME="$(jq -r '.name' resolved-release.json)"
            URL="$(jq -r '.html_url' resolved-release.json)"
            test -n "${TAG}" && test "${TAG}" != "null"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Find release assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          API_URL="${GITHUB_API_URL}/repos/${REPO}/releases/tags/${TAG}"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}" > release.json
          APK_URL="$(jq -r '.assets[] | select(.name == \"AngelaBox-android.apk\") | .browser_download_url' release.json | head -n1)"
          SHA_URL="$(jq -r '.assets[] | select(.name == \"AngelaBox-android.apk.sha256\") | .browser_download_url' release.json | head -n1)"
          jq -r '.body // ""' release.json > release-body.txt
          if [ -z "${APK_URL}" ] || [ "${APK_URL}" = "null" ]; then
            echo "::error::AngelaBox-android.apk was not found in the release."
            jq -r '.assets[].name' release.json
            exit 1
          fi
          if [ -z "${SHA_URL}" ] || [ "${SHA_URL}" = "null" ]; then
            echo "::error::AngelaBox-android.apk.sha256 was not found in the release."
            exit 1
          fi
          echo "apk_url=${APK_URL}" >> "$GITHUB_OUTPUT"
          echo "sha_url=${SHA_URL}" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          APK_URL: ${{ steps.assets.outputs.apk_url }}
          SHA_URL: ${{ steps.assets.outputs.sha_url }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "${APK_URL}" -o AngelaBox-android.apk
          curl -fL --retry 3 --retry-delay 2 "${SHA_URL}" -o AngelaBox-android.apk.sha256
          test -s AngelaBox-android.apk
          test -s AngelaBox-android.apk.sha256
          ls -lh AngelaBox-android.apk

      - name: Verify APK checksum
        id: checksum
        run: |
          set -euo pipefail
          EXPECTED="$(awk '{print $1}' AngelaBox-android.apk.sha256)"
          ACTUAL="$(sha256sum AngelaBox-android.apk | awk '{print $1}')"
          echo "expected=${EXPECTED}"
          echo "actual=${ACTUAL}"
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "::error::SHA256 verification failed."
            exit 1
          fi
          echo "sha256=${ACTUAL}" >> "$GITHUB_OUTPUT"

      - name: Build Telegram message
        env:
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path
          tag = os.environ["TAG"]
          release_name = os.environ.get("RELEASE_NAME") or f"AngelaBox {tag}"
          release_body = Path("release-body.txt").read_text(encoding="utf-8") if Path("release-body.txt").exists() else ""
          release_url = os.environ["RELEASE_URL"]
          sha256 = os.environ["SHA256"]
          if len(release_body) > 2600:
              release_body = release_body[:2600].rstrip() + "\n…"
          message = f"""🚀 AngelaBox {tag}\n\n{release_name}\n\n{release_body}\n\n📱 Android\nPackage: io.chainbox.app\n\n🔐 SHA256\n{sha256}\n\n🔗 GitHub Release\n{release_url}\n"""
          Path("telegram-message.txt").write_text(message, encoding="utf-8")
          PY

      - name: Send announcement to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        run: |
          set -euo pipefail
          test -n "${TG_BOT_TOKEN}"
          test -n "${TG_CHANNEL_ID}"
          RESPONSE="$(curl -fsSL --retry 3 --retry-delay 2 \
            -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHANNEL_ID}" \
            --data-urlencode "text=$(cat telegram-message.txt)" \
            --data-urlencode "disable_web_page_preview=false")"
          echo "${RESPONSE}" | jq .
          test "$(echo "${RESPONSE}" | jq -r '.ok')" = "true"

      - name: Upload APK to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          CAPTION="📱 AngelaBox ${TAG}\n\nOfficial Android APK\n\nSHA256:\n${SHA256}\n\nGitHub Release:\n${RELEASE_URL}"
          RESPONSE="$(curl -fsSL --retry 3 --retry-delay 2 \
            -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TG_CHANNEL_ID}" \
            -F "document=@AngelaBox-android.apk" \
            -F "caption=${CAPTION}")"
          echo "${RESPONSE}" | jq .
          test "$(echo "${RESPONSE}" | jq -r '.ok')" = "true"

      - name: Complete
        run: |
          echo "Telegram release publication completed: ${{ steps.release.outputs.tag }}"
