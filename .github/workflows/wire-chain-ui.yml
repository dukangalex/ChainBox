name: Wire Chain UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/wire_chain_ui.py'
      - '.github/workflows/wire-chain-ui.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run wire script
        run: python3 scripts/wire_chain_ui.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/nekohasekai/sfa/compose/navigation/Navigation.kt \
                  app/src/main/java/io/nekohasekai/sfa/compose/screen/tools/ToolsScreen.kt
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: wire Chain builder into Tools and Navigation"
          git push
