name: Fix ChainBox rebrand files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply neutral ChainBox branding
        run: |
          set -e
          git show fc87019086e60a7bceac5e65d45438a928199553:app/build.gradle.kts > app/build.gradle.kts
          git show fc87019086e60a7bceac5e65d45438a928199553:app/src/main/res/values/strings.xml > app/src/main/res/values/strings.xml

          sed -i 's/applicationId = "io.nekohasekai.sfa"/applicationId = "io.chainbox.app"/' app/build.gradle.kts
          sed -i 's/SFA-/ChainBox-/g' app/build.gradle.kts
          sed -i 's/<string name="app_name" translatable="false">sing-box<\/string>/<string name="app_name" translatable="false">ChainBox<\/string>/' app/src/main/res/values/strings.xml

          grep -n applicationId app/build.gradle.kts | head -3
          grep -n app_name app/src/main/res/values/strings.xml | head -3

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/res/values/strings.xml
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "rebrand: applicationId io.chainbox.app, app name ChainBox"
          git push origin HEAD:dev
